name: cryovision
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - opencv
  - rasterio
  - gdal
  - geopandas
  - shapely
  - pyproj
  - fiona
  - earthengine-api
  - geemap
  - scikit-learn
  - scikit-image
  - matplotlib
  - tqdm
  - pyyaml
  - fastapi
  - uvicorn
  - sqlalchemy
  - jupyterlab
  - pytest
  - kaggle
  - tensorboard
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu121
      - torch
      - torchvision
