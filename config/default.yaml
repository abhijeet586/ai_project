data:
  raw_dir: "./data/kaggle_dataset"
  patches_dir: "./data/patches_v1"
  manifest_path: "./data/manifest.json"
  archive_path: "./data/patches_v1.tar.gz"
  keep_ratio: 0.2
  val_split: 0.15
  test_split: 0.15

model:
  base_channels: 32
  in_channels: 4
  out_channels: 1
  depth: 4

training:
  batch_size_cuda: 4
  batch_size_mps: 8
  grad_accum_steps_cuda: 4
  grad_accum_steps_mps: 2
  epochs: 50
  lr: 0.001
  bce_weight: 0.5
  dice_weight: 0.5
  num_workers_windows: 2
  num_workers_mac: 0
  patience: 10
  checkpoint_dir: "./checkpoints"
