<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 15 160 170" width="100%" height="100%">
    <defs>
        <linearGradient id="cryoGradIcon" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#0f2b48" />
            <stop offset="30%" stop-color="#14426b" />
            <stop offset="65%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.3"/>
        </filter>
        
        <!-- One Snowflake Arm (pointing straight down at 6 o'clock) -->
        <g id="snowflake-arm-icon">
            <!-- Main radial stem -->
            <line x1="100" y1="103" x2="100" y2="167" />
            <!-- Outer pair of chevrons -->
            <line x1="100" y1="154" x2="85" y2="142" />
            <line x1="100" y1="154" x2="115" y2="142" />
            <!-- Middle pair of chevrons -->
            <line x1="100" y1="142" x2="82" y2="128" />
            <line x1="100" y1="142" x2="118" y2="128" />
            <!-- Inner pair of chevrons -->
            <line x1="100" y1="130" x2="82" y2="114" />
            <line x1="100" y1="130" x2="118" y2="114" />
        </g>

        <!-- One Cube Interior Line (pointing straight up at 12 o'clock) -->
        <g id="cube-line-icon">
            <line x1="100" y1="97" x2="100" y2="31" />
        </g>
    </defs>

    <!-- Snowflake + 3D Hexagon Geometry -->
    <g stroke="url(#cryoGradIcon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#icon-glow)">
        <!-- Outer Hexagon -->
        <path d="M 100,26 
                 L 163,62.5 
                 L 163,135.5 
                 L 100,172 
                 L 37,135.5 
                 L 37,62.5 Z" />

        <!-- 3D Cube Inverted Y Spokes (12 o'clock, 4 o'clock, 8 o'clock) -->
        <use href="#cube-line-icon" />
        <use href="#cube-line-icon" transform="rotate(120 100 100)" />
        <use href="#cube-line-icon" transform="rotate(240 100 100)" />

        <!-- Snowflake Crystal Arms (6 o'clock, 10 o'clock, 2 o'clock) -->
        <use href="#snowflake-arm-icon" />
        <use href="#snowflake-arm-icon" transform="rotate(120 100 100)" />
        <use href="#snowflake-arm-icon" transform="rotate(240 100 100)" />
    </g>
</svg>
