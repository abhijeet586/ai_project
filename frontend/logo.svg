<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="100%" height="100%">
    <defs>
        <!-- Authentic gradient matching the design from deep navy to vivid ice blue -->
        <linearGradient id="cryoGrad" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#0f2b48" />
            <stop offset="25%" stop-color="#14426b" />
            <stop offset="60%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <linearGradient id="cryoGradText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        
        <!-- One Snowflake Arm (pointing straight down at 6 o'clock) -->
        <g id="snowflake-arm">
            <!-- Main radial stem -->
            <line x1="100" y1="104" x2="100" y2="167" />
            <!-- Outer pair of chevrons -->
            <line x1="100" y1="154" x2="85" y2="142" />
            <line x1="100" y1="154" x2="115" y2="142" />
            <!-- Middle pair of chevrons -->
            <line x1="100" y1="142" x2="82" y2="128" />
            <line x1="100" y1="142" x2="118" y2="128" />
            <!-- Inner pair of chevrons -->
            <line x1="100" y1="130" x2="82" y2="114" />
            <line x1="100" y1="130" x2="118" y2="114" />
        </g>

        <!-- One Cube Interior Line (pointing straight up at 12 o'clock) -->
        <g id="cube-line">
            <line x1="100" y1="96" x2="100" y2="31" />
        </g>
    </defs>

    <!-- Snowflake + 3D Hexagon Geometry -->
    <g stroke="url(#cryoGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Outer Hexagon with rounded corners and segmented edges -->
        <path d="M 100,26 
                 L 163,62.5 
                 L 163,135.5 
                 L 100,172 
                 L 37,135.5 
                 L 37,62.5 Z" />

        <!-- 3D Cube Inverted Y Spokes (12 o'clock, 4 o'clock, 8 o'clock) -->
        <use href="#cube-line" />
        <use href="#cube-line" transform="rotate(120 100 100)" />
        <use href="#cube-line" transform="rotate(240 100 100)" />

        <!-- Snowflake Crystal Arms (6 o'clock, 10 o'clock, 2 o'clock) -->
        <use href="#snowflake-arm" />
        <use href="#snowflake-arm" transform="rotate(120 100 100)" />
        <use href="#snowflake-arm" transform="rotate(240 100 100)" />
    </g>

    <!-- Wordmark "CRYOVISION" in geometric bold uppercase -->
    <text x="100" y="214" 
          text-anchor="middle" 
          font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#38bdf8">CRYOVISION</text>
</svg>
